<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Family Points Board</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<div id="root" class="fpb-root">

  <!-- Who am I picker (first load on a device) -->
  <div id="whoami" class="fpb-modal-backdrop" hidden>
    <div class="fpb-modal">
      <div class="fpb-modal-head"><span>Who's using this device?</span></div>
      <div id="whoami-kids" class="fpb-whoami-list"></div>
      <button id="whoami-parent-btn" class="fpb-textbtn">I'm the parent</button>
    </div>
  </div>

  <!-- Parent PIN prompt -->
  <div id="pinModal" class="fpb-modal-backdrop" hidden>
    <div class="fpb-modal">
      <div class="fpb-modal-head"><span id="pinTitle">Enter parent PIN</span></div>
      <input id="pinInput" class="fpb-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" />
      <div class="fpb-modal-add">
        <button id="pinCancel" class="fpb-textbtn">Cancel</button>
        <button id="pinSubmit" class="fpb-icon-btn add" style="width:auto;padding:0 18px;">Go</button>
      </div>
      <div id="pinError" class="fpb-pin-error" hidden>Incorrect PIN. Try again.</div>
    </div>
  </div>

  <header class="fpb-header">
    <div class="fpb-eyebrow">FAMILY POINTS BOARD</div>
    <div class="fpb-header-row">
      <div id="kidtabs" class="fpb-kidtabs"></div>
      <div class="fpb-header-actions">
        <span id="roleBadge" class="fpb-role-badge"></span>
        <button id="switchUserBtn" class="fpb-icon-btn" title="Switch user">⇄</button>
        <button id="settingsBtn" class="fpb-icon-btn" title="Settings" hidden>⚙</button>
      </div>
    </div>
  </header>

  <section class="fpb-hero">
    <div class="fpb-hero-label">CURRENT BALANCE</div>
    <div id="scoreboard" class="fpb-scoreboard"></div>
    <div class="fpb-hero-sub"><span>🏆</span><span id="weekPoints">0 pts earned this week</span></div>
  </section>

  <nav class="fpb-tabs" id="tabs">
    <button class="fpb-tab active" data-tab="earn">Log</button>
    <button class="fpb-tab" data-tab="redeem">Rewards</button>
    <button class="fpb-tab" data-tab="history">History</button>
    <button class="fpb-tab" data-tab="trends">Trends</button>
    <button class="fpb-tab" data-tab="approvals" id="approvalsTabBtn" hidden>Approvals <span id="pendingCount" class="fpb-badge" hidden>0</span></button>
  </nav>

  <main class="fpb-main">
    <div id="view-earn" class="fpb-view"><div id="earnGrid" class="fpb-grid"></div></div>

    <div id="view-redeem" class="fpb-view" hidden><div id="redeemGrid" class="fpb-grid"></div></div>

    <div id="view-history" class="fpb-view" hidden><ul id="historyList" class="fpb-history"></ul></div>

    <div id="view-trends" class="fpb-view" hidden>
      <div class="fpb-chart-wrap"><canvas id="trendChart" height="180"></canvas></div>
      <div id="weekList" class="fpb-weeklist"></div>
    </div>

    <div id="view-approvals" class="fpb-view" hidden><ul id="approvalsList" class="fpb-history"></ul></div>
  </main>

  <div id="toast" class="fpb-toast" hidden></div>

  <!-- Settings panel -->
  <div id="settingsModal" class="fpb-modal-backdrop" hidden>
    <div class="fpb-modal">
      <div class="fpb-modal-head"><span>Settings</span><button id="settingsClose" class="fpb-icon-btn">✕</button></div>
      <div class="fpb-modal-tabs">
        <button class="active" data-stab="activities">Activities</button>
        <button data-stab="rewards">Rewards</button>
        <button data-stab="kids">Kids</button>
        <button data-stab="pin">PIN</button>
      </div>
      <div id="stab-activities" class="fpb-stab-panel"></div>
      <div id="stab-rewards" class="fpb-stab-panel" hidden></div>
      <div id="stab-kids" class="fpb-stab-panel" hidden></div>
      <div id="stab-pin" class="fpb-stab-panel" hidden>
        <p class="fpb-hint">Change the parent PIN.</p>
        <input id="newPinInput" class="fpb-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN" />
        <button id="savePinBtn" class="fpb-icon-btn add" style="width:auto;padding:0 18px;margin-top:10px;">Save PIN</button>
      </div>
    </div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
